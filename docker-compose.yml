services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: persepsi-frontend:latest
    container_name: pr-frontend
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: persepsi-backend:latest
    container_name: pr-backend
    network_mode: "host"
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./datasets:/app/datasets
      - ./output:/app/output
    restart: unless-stopped